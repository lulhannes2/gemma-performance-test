[project]
name = "gemma-performance-test"
version = "0.1.0"
description = "Gemma 2 26B & 31B performance testing on DGX A100"
requires-python = ">=3.12"
authors = [
    {name = "AI Engineer", email = "ai@cjib.local"}
]

dependencies = [
    "vllm>=0.4.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
]

[tool.hatch.envs.default]
python = "3.12"
type = "virtual"
path = ".venv"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I"]
